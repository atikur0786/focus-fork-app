name: Build And Release Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 pinned: the windows-2025 image breaks node-gyp's Visual
        # Studio detection, which node-pty needs to compile.
        os: [ubuntu-latest, windows-2022, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # @electron/rebuild 4 (node-pty native builds) requires Node >= 22.12.
          node-version: 22
          cache: npm

      - name: Prepare app config
        env:
          # Secret and env names must not start with GITHUB_ (reserved by Actions).
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        # bash explicitly: the default shell on windows-latest is pwsh, which
        # cannot parse the [ -n ... ] test below.
        shell: bash
        run: |
          mkdir -p resources
          if [ -n "$OAUTH_CLIENT_ID" ]; then
            printf '{\n  "githubClientId": "%s"\n}\n' "$OAUTH_CLIENT_ID" > resources/app-config.json
          else
            echo "No OAUTH_CLIENT_ID secret configured. Build will work, login won't."
            printf '{\n  "githubClientId": ""\n}\n' > resources/app-config.json
          fi

      - name: Install dependencies
        run: npm ci

      # --publish never: on tagged commits electron-builder implicitly tries to
      # publish to GitHub itself (needs GH_TOKEN). The release job below is the
      # single publish path.
      - name: Build Linux artifacts
        if: runner.os == 'Linux'
        run: npm run build:linux -- --publish never

      - name: Build Windows artifacts
        if: runner.os == 'Windows'
        run: npm run build:win -- --publish never

      - name: Build macOS artifacts
        if: runner.os == 'macOS'
        run: npm run build:mac -- --publish never

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: focusfork-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: focusfork-windows
          path: |
            dist/*setup*.exe
            dist/*.exe
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: focusfork-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # always(): publish whatever platforms built successfully — one failing
    # leg must not hold back the others' artifacts.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
          generate_release_notes: true
          # Tags like v0.1.0-beta.1 are marked pre-release automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # The landing site reads the newest release from the GitHub API and
      # caches it. Rebuilding right after publishing makes the new version
      # appear immediately instead of after the cache window. No-ops when the
      # VERCEL_DEPLOY_HOOK secret is not configured.
      - name: Refresh the landing site
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null && echo "Triggered landing site rebuild."
          else
            echo "VERCEL_DEPLOY_HOOK not set — skipping landing rebuild."
          fi
